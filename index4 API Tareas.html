<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>API Tareas</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>


</head>

<body>
    <div id="contenedor">
    </div>
    <form id="formulario_tarea">
        <input type="text" id="text" placeholder="Nombre de la tarea" required><br>
        <button type="submit">Agregar tarea</button>
    </form>


    <script>
        //API: URL base
        const API_URL = 'http://localhost:8080/api/tareas';
        cartaInicial(); //Llamada inicial para cargar las tareas

        //Carga de datos desde la API y los muestra en pantalla
        function cartaInicial() {
            fetch(API_URL)
                .then(response => response.json())
                .then(tareas => {
                    console.log(tareas);
                    const contenedor = document.getElementById('contenedor');
                    contenedor.innerHTML = ''; // Limpiar el contenedor
                    tareas.forEach(tarea => {
                        const divTarea = document.createElement('div');
                        divTarea.innerHTML = `
                        <input type="checkbox" ${tarea.completada ? 'checked' : ''} onclick="cambiarEstado(${tarea.id}, this.checked)">
                        ${tarea.texto}
                        <a href="#" class="borrar" onclick="borrarTarea(${tarea.id})">X</a>
                        
                    `;
                        contenedor.appendChild(divTarea);
                    }
                    );
                })
                .catch(error => console.error('Error al cargar las tareas:', error));
        }

        //Borrar tarea
        function borrarTarea(id) {
            fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            })
                .then(response => {
                    if (response.ok) {
                        console.log(`Tarea con id ${id} borrada`);
                        // Recargar la página para reflejar los cambios
                        cartaInicial();
                    } else {
                        console.error('Error al borrar la tarea');
                    }
                })
                .catch(error => console.error('Error al borrar la tarea:', error));
        }

        //Agregar tarea
        document.getElementById('formulario_tarea').addEventListener('submit', function (event) {
            event.preventDefault(); // Evitar que se recargue la página al enviar el formulario
            const texto = document.getElementById('text').value;

            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ texto: texto })
            })
                .then(response => {
                    if (response.ok) {
                        // Recargar la página para reflejar los cambios
                        cartaInicial();
                        // Limpiar el formulario
                        document.getElementById('formulario_tarea').reset();
                    } else {
                        console.error('Error al agregar la tarea');
                    }
                })
                .catch(error => console.error('Error al agregar la tarea:', error));
        });

        //marcar tarea como completada
        function cambiarEstado(id, completada) {
            if(completada) {
             
            } else {
             
            }
            fetch(`${API_URL}/${id}/finalizar`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ completada: completada })
            })
                .then(response => {
                    if (response.ok) {
                        console.log(`Tarea con id ${id} actualizada`);
                    } else {
                        console.error('Error al actualizar la tarea');
                    }
                })
                .catch(error => console.error('Error al actualizar la tarea:', error));
        }

    </script>
</body>

</html>
